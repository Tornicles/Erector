services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8001:8001"
    env_file: ./backend/.env
  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_dependencies:/app/node_modules
    command: sh -c "npm ci && npm run start -- --host 0.0.0.0"
volumes:
  frontend_dependencies:
