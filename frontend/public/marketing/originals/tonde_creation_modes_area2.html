const routes=['real','ai','hybrid','shotmatch'];
const copy={
 real:{label:'REAL PRODUCTION',title:'Walk onto set knowing what to do.',lede:'TONDE turns creative intent into practical direction for the camera, light, performance, sound, crew, and location you actually have.'},
 ai:{label:'AI CREATION',title:'Direct the scene. Let TONDE handle prompt complexity.',lede:'Build one coherent Production. TONDE compiles the generation instructions, continuity, locks, and attempts needed to execute it with AI.'},
 hybrid:{label:'HYBRID PRODUCTION',title:'Shoot what should be real. Generate what should not.',lede:'Real and AI are execution choices at the Shot level. The story, continuity, Results, and approvals stay inside one Production.'},
 shotmatch:{label:'SHOT MATCH',title:'Did you actually get the Shot?',lede:'Compare the Reference, the Plan, and the Result. See what matches, what changed, what is uncertain, and what to fix next.'}
};
function routebar(id){return `<div class="routebar"><div class="shell routein">${routes.map(r=>`<button class="${r===id?'active':''}" onclick="go('${r}')">${copy[r].label}</button>`).join('')}</div></div>`}
function img(k,alt='TONDE production visual'){return `<img src="${IMGS[k]}" alt="${alt}">`}
function actions(primary,secondary){return `<div class="actions"><button class="primary" onclick="planned('${primary}')">${primary}</button><button class="secondary" onclick="planned('${secondary}')">${secondary}</button></div>`}
function external(file,hash){location.href=file+'#'+hash}
function planned(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function toggleMobile(btn){const m=document.getElementById('mobileMenu');const open=m.classList.toggle('open');btn.setAttribute('aria-expanded',String(open))}
function go(id){if(!routes.includes(id))id='real';history.replaceState(null,'','#'+id);render(id);document.getElementById('mobileMenu').classList.remove('open');window.scrollTo({top:0,behavior:'instant'})}
const kitData={
 phone:{title:'Phone kit',sub:'Flagship phone, gimbal, one LED, wireless mic',rows:[['Camera','Main rear camera, stabilized'],['Lens behavior','Normal field of view, avoid digital zoom'],['Movement','Slow gimbal push, 1.2 m travel'],['Exposure','24 fps, 1 over 48 shutter equivalent, lock exposure'],['Light','LED 45 degrees camera left, close and softened'],['Audio','Wireless lav, capture 30 seconds room tone']]},
 mirrorless:{title:'Mirrorless kit',sub:'Full frame body, 35 mm and 85 mm, two lights, boom',rows:[['Camera','Full frame mirrorless'],['Lens','35 mm for move, 85 mm for reaction'],['Movement','Compact slider, 45 cm travel'],['Exposure','24 fps, 1 over 50, aperture around f2.8'],['Light','Soft key plus controlled edge light'],['Audio','Boom primary, lav safety, room tone']]},
 cinema:{title:'Cinema kit',sub:'Cinema body, prime set, dolly, full lighting and sound crew',rows:[['Camera','Cinema body with log capture'],['Lens','40 mm prime for hero move'],['Movement','Dolly with repeatable marks'],['Exposure','24 fps, 180 degree shutter, meter skin and practicals'],['Light','Large soft key, negative fill, motivated practicals'],['Audio','Boom and wireless iso tracks with dedicated mixer']]}
};
const hybridShots={
 1:{title:'Shot 01',mode:'SHOOT',copy:'The opening performance is real because facial nuance and product handling matter. TONDE keeps the practical location, actor blocking, camera height, and audio capture attached to the same Shot.'},
 2:{title:'Shot 02',mode:'SHOOT',copy:'The close product interaction stays real for material accuracy and label fidelity. The plan reuses lighting direction and wardrobe state established in Shot 01.'},
 3:{title:'Shot 03',mode:'GENERATE',copy:'The wide impossible environment is generated. Character identity, wardrobe, time of day, color logic, and the previous Shot end state become locked generation context.'},
 4:{title:'Shot 04',mode:'SHOOT + AI',copy:'A real performance plate receives an AI environment extension. TONDE preserves camera perspective and subject movement so the composite belongs to the same visual sequence.'},
 5:{title:'Shot 05',mode:'SHOOT',copy:'The sequence returns to a practical close up. Continuity state carries back from the generated material so eyeline, light direction, product state, and timing still connect.'}
};
function renderReal(){return `${routebar('real')}<main class="page realPage"><section class="shell realHero"><div><div class="eyebrow">${copy.real.label}</div><h1 class="heroTitle">${copy.real.title}</h1><p class="lede">${copy.real.lede}</p>${actions('DIRECT A REAL SHOOT','SEE THE SHOT PLAN')}</div><div class="setStage">${img('0','Production set with camera, light, and performer')}<div class="reticle"></div><div class="setMarker mCam"><b>CAMERA</b><span>1.35 m height · slow push</span></div><div class="setMarker mKey"><b>KEY LIGHT</b><span>soft source · 45 degrees</span></div><div class="setMarker mActor"><b>PERFORMANCE</b><span>hold eye line · delay turn</span></div></div></section><div class="divider"></div>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow" style="color:var(--warm)">ONE CREATIVE GOAL</div><h2>The kit changes. The intention does not.</h2></div><p>TONDE adapts the execution to what the creator actually has. Switch the Production Kit below. The mood and Shot purpose stay fixed while camera behavior, movement, light, and sound direction change around the resources.</p></div><div class="kitSwitch"><div class="kitTabs"><button class="on" onclick="setKit('phone',this)"><b>Phone kit</b><small>Solo creator</small></button><button onclick="setKit('mirrorless',this)"><b>Mirrorless kit</b><small>Small crew</small></button><button onclick="setKit('cinema',this)"><b>Cinema kit</b><small>Full crew</small></button></div><div class="kitPanel" id="kitPanel"></div></div></section>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow" style="color:var(--warm)">SHOT BLUEPRINT</div><h2>Every setting answers to the Shot.</h2></div><p>TONDE should never hand the creator a pile of disconnected settings. Camera, light, performance, sound, blocking, and order are tied to one reason: what this Shot needs to communicate.</p></div><div class="shotBlueprint"><div class="monitor">${img('4','Directed shot frame with performer and camera marks')}<div class="monitorOverlay"></div><div class="monitorReadout"><span>SHOT 04 · TAKE PLAN</span><span>00:06 · 24 FPS · REAL</span></div></div><div class="shotSpec"><div class="tiny">SHOT 04 · REVEAL</div><h3>Stay close until the decision lands.</h3><div class="specRow"><span>PURPOSE</span><b>Turn uncertainty into commitment without changing location.</b></div><div class="specRow"><span>CAMERA</span><b>Chest height. 35 mm equivalent. Hold, then move after the line.</b></div><div class="specRow"><span>LIGHT</span><b>Keep key soft. Let background practical fall one stop under the face.</b></div><div class="specRow"><span>BLOCKING</span><b>Actor remains seated. Hand enters frame only after the pause.</b></div><div class="specRow"><span>SOUND</span><b>Lav primary. Record room tone before moving the chair.</b></div><div class="specRow"><span>CONTINUITY</span><b>Mug handle stays camera right. Jacket open. Eye line remains left.</b></div></div></div></section>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow" style="color:var(--warm)">REALITY MOVES</div><h2>The plan can change without losing the production.</h2></div><p>A smaller room, late sun, noisy air conditioning, missing lens, or changed performance path should not collapse the whole production. TONDE revises the affected execution while preserving the Story, Scene purpose, continuity, and accepted decisions around it.</p></div><div class="realFooterCallout"><div><div class="tiny">LOCATION CHANGE</div><h3>The room is 30 percent tighter.</h3><p>TONDE shortens camera travel, changes the lens recommendation, moves negative fill, and preserves the same emotional reveal rather than telling the creator the original Shot is impossible.</p></div><div><div class="tiny">AUDIO RISK</div><h3>The location is louder than expected.</h3><p>Move the microphone closer, protect the lav, capture wild lines if needed, record room tone, and flag which dialogue coverage becomes risky before the crew discovers it in the edit.</p></div></div></section></main>`}
function renderAI(){return `${routebar('ai')}<main class="page aiPage"><section class="shell aiHero"><div><div class="eyebrow">${copy.ai.label}</div><h1 class="heroTitle">${copy.ai.title}</h1><p class="lede">${copy.ai.lede}</p>${actions('BUILD AN AI SCENE','OPEN PROMPT COMPILER')}</div><div class="compiler"><div class="compilerHead"><b>TONDE PROMPT COMPILER</b><span class="live"><i></i> COMPILING</span></div><div class="sourceNodes"><div class="sourceNode"><small>Story</small><b>Escape before dawn</b></div><div class="sourceNode"><small>Character lock</small><b>Mara · approved identity</b></div><div class="sourceNode"><small>World lock</small><b>Wet industrial district</b></div><div class="sourceNode"><small>Shot intent</small><b>Realization becomes urgency</b></div></div><div class="compileCore"><div><strong>DIRECTOR</strong><span>context → generation</span></div></div><div class="outputBar"><div>ENVIRONMENT</div><div>ACTION</div><div>CAMERA</div><div>CONTINUITY</div></div></div></section><div class="divider" style="border-color:rgba(180,166,255,.12)"></div>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow" style="color:#b9adff">GENERATION UNITS</div><h2>One Scene. Several executable pieces.</h2></div><p>Model limits should not force the creator to think in disconnected prompts. TONDE keeps the Scene intact and compiles the smaller units needed for execution. Each unit knows what the previous unit established and what the next one must preserve.</p></div><div class="unitTimeline"><div class="unit"><small>UNIT 01 · 0 to 8 seconds</small><b>Establish</b><p>Street, weather, character position, pace, and starting camera state.</p></div><div class="unit"><small>UNIT 02 · 8 to 17 seconds</small><b>Approach</b><p>Character movement inherits wardrobe, direction, environment, and light logic.</p></div><div class="unit"><small>UNIT 03 · 17 to 27 seconds</small><b>Realize</b><p>Performance change drives a tighter frame while world state remains locked.</p></div><div class="unit"><small>UNIT 04 · 27 to 38 seconds</small><b>Run</b><p>Motion increases. Previous end pose becomes the next starting constraint.</p></div><div class="unit"><small>UNIT 05 · 38 to 45 seconds</small><b>Exit</b><p>End state is preserved for the next Scene instead of disappearing in a prompt.</p></div></div></section>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow" style="color:#b9adff">LOCKS AND ROUTING</div><h2>Keep what matters stable. Change what should move.</h2></div><p>Character, world, style, product, and end state locks protect continuity. Provider routing then considers the actual requirements of the Shot instead of making the creator memorize which model supports which capability.</p></div><div class="lockGrid"><div class="lockPanel"><h3>Production locks</h3><div class="lockRow"><span>Character</span><b>Mara V03</b><span class="status">LOCKED</span></div><div class="lockRow"><span>Wardrobe</span><b>Black rain shell</b><span class="status">LOCKED</span></div><div class="lockRow"><span>World</span><b>District A · dawn</b><span class="status">LOCKED</span></div><div class="lockRow"><span>Camera</span><b>Handheld, chest height</b><span class="status">SHOT</span></div><div class="lockRow"><span>End state</span><b>Running frame right</b><span class="status">INHERIT</span></div></div><div class="routerPanel"><h3>Capability route</h3><div class="routeMatrix"><div class="routeItem"><b>Video generation</b><span>Required</span><span>✓</span></div><div class="routeItem"><b>Image conditioning</b><span>Required</span><span>✓</span></div><div class="routeItem"><b>Character consistency</b><span>High</span><span>✓</span></div><div class="routeItem"><b>Lip sync</b><span>Not needed</span><span>none</span></div><div class="routeItem"><b>Native audio</b><span>Optional</span><span>route later</span></div></div></div></div></section>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow" style="color:#b9adff">ATTEMPTS</div><h2>Try again without losing what happened.</h2></div><p>An AI attempt is execution evidence, not a new Production. TONDE keeps each attempt tied to the Shot, the plan, the model profile, the prompt version, and the continuity state that produced it.</p></div><div class="attempts"><div class="attempt">${img('7','AI generation attempt with geometric world composition')}<div class="attemptText"><small>ATTEMPT 01</small><b>World strong. Identity drift.</b><p>Keep the environment. Strengthen approved character reference and reduce style pressure on facial features.</p></div></div><div class="attempt">${img('13','AI generation sequence with character frames')}<div class="attemptText"><small>ATTEMPT 02</small><b>Identity stable. Camera too static.</b><p>Preserve locks. Increase forward movement and carry the previous end pose into the camera change.</p></div></div><div class="attempt">${img('3','AI performance frame with music and light treatment')}<div class="attemptText"><small>ATTEMPT 03</small><b>Selected Result.</b><p>Character, world, movement, and continuity all meet the Shot intent. Creator can now review or continue.</p></div></div></div></section></main>`}
function renderHybrid(){return `${routebar('hybrid')}<main class="page hybridPage"><section class="hybridHero"><div class="hybridHalf hybridReal">${img('0','Real production set')}</div><div class="hybridHalf hybridAI">${img('7','Generated production environment')}</div><div class="sideLabel realLabel">REAL</div><div class="sideLabel aiLabel">AI</div><div class="hybridCenter"><div class="eyebrow">${copy.hybrid.label}</div><h1>${copy.hybrid.title}</h1><p>${copy.hybrid.lede}</p>${actions('PLAN A HYBRID PRODUCTION','SEE THE SHOT DECISIONS')}</div></section>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow" style="color:var(--green)">ONE PRODUCTION</div><h2>Execution changes Shot by Shot.</h2></div><p>Choose a Shot below. TONDE can recommend SHOOT, GENERATE, or SHOOT + AI based on product truth, performance, feasibility, environment access, continuity, time, and the actual Production Kit.</p></div><div class="sequence" id="hybridSequence">${[1,2,3,4,5].map((n,i)=>{const x=hybridShots[n];const cl=x.mode==='SHOOT'?'shoot':x.mode==='GENERATE'?'generate':'both';return `<button class="seqShot ${i===0?'on':''}" onclick="selectHybrid(${n},this)"><small>${x.title.toUpperCase()}</small><b>${n.toString().padStart(2,'0')}</b><span class="badge ${cl}">${x.mode}</span></button>`}).join('')}</div><div class="hybridInspector" id="hybridInspector"></div></section>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow" style="color:#c6bcff">CONTINUITY BRIDGE</div><h2>The viewer should not feel the production method change.</h2></div><p>Real and generated material still share the same creative state. TONDE carries forward the details that matter so a sequence can cross execution methods without losing identity.</p></div><div class="continuityRail"><div class="continuityCard"><small>IDENTITY</small><b>Character V03</b><p>Face, hair, age, body proportions, and approved identity references persist.</p></div><div class="continuityCard"><small>WARDROBE</small><b>Rain shell · open collar</b><p>Color, material, fasteners, wetness, and state remain continuous across Shots.</p></div><div class="continuityCard"><small>LIGHT</small><b>Cool dawn · warm practical</b><p>Generated environment respects the same motivated direction established on set.</p></div><div class="continuityCard"><small>END STATE</small><b>Frame right · turning back</b><p>The last state of one execution becomes the starting constraint of the next.</p></div></div></section>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow" style="color:var(--green)">DECISION LOGIC</div><h2>Use the method that serves the Shot.</h2></div><p>Hybrid is not an excuse to generate anything that is inconvenient. TONDE should explain why an execution method is recommended and preserve creator authority over the decision.</p></div><div class="decisionMatrix"><div class="decisionBox"><h3>Prefer Real when</h3><div class="choiceRow"><b>Performance</b><span>Subtle human timing and interaction are central to the Shot.</span></div><div class="choiceRow"><b>Product truth</b><span>Physical proportions, labels, materials, and handling must remain exact.</span></div><div class="choiceRow"><b>Location access</b><span>The environment already exists and practical capture is efficient.</span></div><div class="choiceRow"><b>Sound</b><span>Real dialogue or location sound is essential evidence.</span></div></div><div class="decisionBox"><h3>Prefer AI when</h3><div class="choiceRow"><b>Environment</b><span>The required world is unsafe, unavailable, or disproportionately expensive.</span></div><div class="choiceRow"><b>Transition</b><span>The Shot intentionally changes reality in a way practical capture cannot.</span></div><div class="choiceRow"><b>Iteration</b><span>Several visual directions need testing before committing production resources.</span></div><div class="choiceRow"><b>Extension</b><span>Real plates can carry performance while AI expands the world around them.</span></div></div></div></section></main>`}
function renderShotMatch(){return `${routebar('shotmatch')}<main class="page matchPage"><section class="shell matchHero"><div class="eyebrow">${copy.shotmatch.label}</div><h1 class="heroTitle">${copy.shotmatch.title}</h1><p class="lede">${copy.shotmatch.lede}</p>${actions('CHECK A SHOT','SEE FIX THIS SHOT')}</section>
<section class="shell section" style="padding-top:30px"><div class="compareShell"><div class="compareFrame" id="compareFrame">${img('12','Planned shot frame for comparison')}<div class="compareResult" id="compareResult">${img('4','Actual result frame for comparison')}</div><div class="compareLine" id="compareLine"></div><div class="compareHandle" id="compareHandle">↔</div><div class="compareLabels"><span>PLAN</span><span>RESULT</span></div><label class="sr" for="compareRange">Compare plan and result</label><input class="compareRange" id="compareRange" type="range" min="0" max="100" value="52" oninput="setCompare(this.value)"></div><aside class="findingPanel"><div class="tiny">SHOT 04 · ANALYSIS</div><h3>Three things changed.</h3><div class="finding"><div class="findingTop"><b>Framing drifts left</b><span class="ep obs">OBSERVED</span></div><p>The face finishes 8 percent farther left than the planned frame. The label remains visible.</p></div><div class="finding"><div class="findingTop"><b>Key light appears harder</b><span class="ep est">ESTIMATED</span></div><p>Shadow edge suggests the source moved farther from the performer. Exact fixture distance is not visible.</p></div><div class="finding"><div class="findingTop"><b>Delay the hand movement</b><span class="ep rec">RECOMMENDED</span></div><p>Keep the current performance but move the hand action after the line lands so the reveal reads more clearly.</p></div><div class="finding"><div class="findingTop"><b>Microphone position</b><span class="ep unk">UNKNOWN</span></div><p>The frame does not provide enough evidence to identify the recording position.</p></div></aside></div><div class="metrics"><div class="metric"><small>FRAMING</small><strong>84%</strong></div><div class="metric"><small>LIGHTING</small><strong>76%</strong></div><div class="metric"><small>PERFORMANCE</small><strong>91%</strong></div><div class="metric"><small>CONTINUITY</small><strong>96%</strong></div></div></section>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow">FIX THIS SHOT</div><h2>Turn a finding into the next action.</h2></div><p>Shot Match should not end with a score. A useful finding becomes a scoped correction that preserves what already works. The first Result remains in history while the creator produces the next Take or attempt.</p></div><div class="fixFlow"><div class="fixCard"><small>TAKE 01</small><h3>Keep</h3><p>Lighting direction, eye line, wardrobe state, product position, and the first half of the performance already support the plan.</p></div><div class="arrow">→</div><div class="fixCard"><small>CORRECTION</small><h3>Change only two things</h3><p>End 12 cm farther right and delay the hand action until after the line. Do not change light placement unless the shadow becomes visibly harder.</p></div><div class="arrow">→</div><div class="fixCard"><small>TAKE 02</small><h3>Review again</h3><p>Upload the corrected Result. TONDE compares it against the same plan and the previous Take before the creator decides whether to approve.</p></div></div></section>
<section class="shell section"><div class="sectionHead"><div><div class="eyebrow">HISTORY</div><h2>Improvement stays visible.</h2></div><p>TONDE does not overwrite the path that got the creator there. Results, analyses, corrections, and approvals remain attached to the Shot so the team can understand what was accepted and why.</p></div><div class="history"><div class="historyCard"><small>PLAN V03</small><b>Approved direction</b><p>Framing, performance timing, product position, lighting intent.</p></div><div class="historyCard"><small>TAKE 01</small><b>Needs correction</b><p>Useful Result with framing and action timing findings.</p></div><div class="historyCard"><small>FIX 01</small><b>Scoped correction</b><p>Two changes only. Existing continuity preserved.</p></div><div class="historyCard active"><small>TAKE 02</small><b>Ready for creator review</b><p>New Result remains separate until the creator explicitly approves it.</p></div></div></section></main>`}
function setKit(k,btn){document.querySelectorAll('.kitTabs button').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');const d=kitData[k];document.getElementById('kitPanel').innerHTML=`<div class="tiny">PRODUCTION KIT ADAPTATION</div><h3>${d.title}</h3><p style="color:#9fb0a5;margin:0 0 22px">${d.sub}</p><div class="setupGrid">${d.rows.map(r=>`<div class="setupCell"><small>${r[0]}</small><b>${r[1]}</b></div>`).join('')}</div>`}
function selectHybrid(n,btn){document.querySelectorAll('.seqShot').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');const d=hybridShots[n];const cl=d.mode==='SHOOT'?'shoot':d.mode==='GENERATE'?'generate':'both';document.getElementById('hybridInspector').innerHTML=`<div><div class="tiny">SELECTED SHOT</div><h3>${d.title}</h3><span class="badge ${cl}">${d.mode}</span></div><p>${d.copy}</p>`}
function setCompare(v){const n=Number(v);document.getElementById('compareResult').style.clipPath=`inset(0 0 0 ${n}%)`;document.getElementById('compareLine').style.left=n+'%';document.getElementById('compareHandle').style.left=n+'%'}
function render(id){const app=document.getElementById('app');app.innerHTML=id==='ai'?renderAI():id==='hybrid'?renderHybrid():id==='shotmatch'?renderShotMatch():renderReal();document.body.dataset.page=id;if(id==='real')setTimeout(()=>setKit('phone',document.querySelector('.kitTabs button')),0);if(id==='hybrid')setTimeout(()=>selectHybrid(1,document.querySelector('.seqShot')),0);document.title='TONDE | '+copy[id].label.replace('PRODUCTION','Production').replace('CREATION','Creation').replace('SHOT MATCH','Shot Match')}
window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'real'));
render(location.hash.slice(1)||'real');
</script>
