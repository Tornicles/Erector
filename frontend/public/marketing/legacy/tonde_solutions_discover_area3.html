<script>
const ROUTES=[['solutions','Solutions'],['film','Film and Video'],['photo','Photography'],['commercial','Commercial'],['music','Music Video'],['documentary','Documentary'],['social','YouTube and Social'],['series','Series'],['events','Weddings and Events'],['discover','Discover'],['technique','Technique']];
const TECHNIQUES={
  negative:{title:'Negative space for tension',category:'Composition',purpose:'Create anticipation before movement happens',real:'Place the subject off center, control background clutter, and reserve meaningful empty frame space toward the direction of attention or threat.',ai:'Describe the spatial relationship and emotional reason for the empty area. Lock identity and environment before changing composition.',camera:'Static or restrained movement',light:'Keep the empty field readable without making it visually louder than the subject',sound:'Use room tone or restrained sound so the visual expectation has time to register'},
  orbit:{title:'Product orbit reveal',category:'Camera',purpose:'Reveal shape, finish, and premium detail through controlled movement',real:'Use a repeatable circular path, consistent lens distance, controlled reflections, and a hero stop where branding is fully readable.',ai:'Define the product lock, rotation path, lens behavior, lighting continuity, and final hero angle across generation units.',camera:'Slow circular move',light:'Large soft source with controlled edge highlights',sound:'Use a restrained rise or tactile product sound on the hero stop'},
  handheld:{title:'Handheld tension',category:'Camera',purpose:'Add instability while preserving readable performance',real:'Keep the operator close to the performer, define acceptable drift, protect eyelines, and choose when movement becomes more unstable.',ai:'Describe restrained human camera instability instead of generic shake. Preserve subject identity and scene geography.',camera:'Controlled handheld',light:'Natural motivated light with enough latitude for small reframes',sound:'Let breaths, room texture, and movement carry part of the tension'},
  silhouette:{title:'Silhouette reveal',category:'Lighting',purpose:'Delay identity while making shape and movement instantly readable',real:'Expose for the brighter background, keep the subject separation clean, and reveal facial detail only when story timing calls for it.',ai:'Lock pose, shape, and background direction. Specify when detail should emerge rather than asking only for dramatic lighting.',camera:'Simple frame or slow approach',light:'Strong backlight, restrained front fill',sound:'A cue, door tone, or environmental shift can motivate the reveal'},
  overhead:{title:'Overhead food composition',category:'Photography',purpose:'Organize ingredients and action into one readable graphic frame',real:'Build the arrangement for shape and negative space, protect reflective surfaces, and decide whether hands enter for process or scale.',ai:'Describe the layout relationships, surface material, light direction, food identity, and hand action without overcrowding the prompt.',camera:'True overhead or near overhead',light:'Soft side light with gentle fill',sound:'For motion work, capture tactile preparation sounds separately'},
  match:{title:'Motion match transition',category:'Edit and Movement',purpose:'Connect two different spaces through one shared movement',real:'Plan the ending motion of Shot one and starting motion of Shot two around the same direction, speed, framing logic, and visual anchor.',ai:'Carry the end state of the first generation unit into the next while changing environment or subject context deliberately.',camera:'Matched direction and speed',light:'Can change if the visual anchor stays readable',sound:'Use one continuous cue or impact to bind the transition'}
};
let currentTech='negative';

function svgScene(type){
 const common=`viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"`;

 if(type==='photo')return `<svg ${common}><rect width="800" height="520" fill="#ded9cf"/><rect x="60" y="55" width="290" height="410" fill="#eeeae1"/><circle cx="215" cy="215" r="68" fill="#b77761"/><rect x="155" y="275" width="120" height="150" rx="42" fill="#4d6054"/><rect x="425" y="70" width="270" height="360" fill="#c7c2b8"/><circle cx="560" cy="220" r="90" fill="#d9d4c9"/><circle cx="560" cy="225" r="50" fill="#b77761"/><rect x="505" y="275" width="110" height="125" rx="40" fill="#171b18"/></svg>`;
 if(type==='commercial')return `<svg ${common}><defs><radialGradient id="p"><stop stop-color="#fff"/><stop offset="1" stop-color="#d9dfd8"/></radialGradient></defs><rect width="800" height="520" fill="url(#p)"/><ellipse cx="400" cy="445" rx="190" ry="38" fill="#c7cec7"/><rect x="326" y="145" width="148" height="270" rx="30" fill="#1c3426"/><rect x="360" y="92" width="80" height="70" rx="15" fill="#14251b"/><rect x="342" y="235" width="116" height="70" fill="#f2eee1"/><text x="400" y="275" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#172018">TONDE</text><path d="M130 90 L315 160" stroke="#efbe8a" stroke-width="26" opacity=".25"/><path d="M670 95 L480 180" stroke="#80e9ff" stroke-width="22" opacity=".22"/></svg>`;
 if(type==='music')return `<svg ${common}><defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b1247"/><stop offset="1" stop-color="#07070d"/></linearGradient></defs><rect width="800" height="520" fill="url(#m)"/><path d="M120 0 L330 520" stroke="#9d84ff" stroke-width="90" opacity=".18"/><path d="M620 0 L480 520" stroke="#80e9ff" stroke-width="80" opacity=".14"/><circle cx="402" cy="220" r="55" fill="#b77561"/><rect x="355" y="270" width="94" height="180" rx="35" fill="#060706"/><g fill="#92ffb5" opacity=".75">${Array.from({length:28},(_,i)=>`<rect x="${60+i*25}" y="${450-(i%6)*12}" width="8" height="${30+(i%7)*16}" rx="4"/>`).join('')}</g></svg>`;
 if(type==='doc')return `<svg ${common}><rect width="800" height="520" fill="#c8c2b7"/><rect x="60" y="60" width="360" height="400" fill="#b8b2a7"/><circle cx="250" cy="210" r="62" fill="#9e6b58"/><rect x="190" y="270" width="120" height="160" rx="35" fill="#4d514c"/><rect x="505" y="90" width="220" height="300" fill="#dcd7cd"/><line x1="520" y1="130" x2="700" y2="130" stroke="#807a71"/><line x1="520" y1="180" x2="675" y2="180" stroke="#807a71"/><line x1="520" y1="230" x2="705" y2="230" stroke="#807a71"/><line x1="520" y1="280" x2="650" y2="280" stroke="#807a71"/></svg>`;
 if(type==='social')return `<svg ${common}><rect width="800" height="520" fill="#0e1c16"/><rect x="70" y="70" width="210" height="380" rx="34" fill="#070a08"/><rect x="88" y="90" width="174" height="340" rx="24" fill="#315344"/><circle cx="175" cy="215" r="48" fill="#ba785e"/><rect x="135" y="260" width="80" height="120" rx="28" fill="#121713"/><rect x="350" y="95" width="380" height="220" rx="18" fill="#1b2c24"/><circle cx="540" cy="195" r="50" fill="#b87761"/><rect x="495" y="238" width="90" height="70" rx="22" fill="#0c100d"/><rect x="350" y="340" width="115" height="75" fill="#9d84ff" opacity=".45"/><rect x="485" y="340" width="115" height="75" fill="#80e9ff" opacity=".45"/><rect x="620" y="340" width="110" height="75" fill="#92ffb5" opacity=".45"/></svg>`;
 if(type==='series')return `<svg ${common}><rect width="800" height="520" fill="#09151d"/><rect x="50" y="55" width="180" height="410" rx="18" fill="#0f202a"/><circle cx="140" cy="140" r="45" fill="#80e9ff" opacity=".3"/><rect x="80" y="220" width="120" height="10" fill="#45616f"/><rect x="80" y="250" width="100" height="10" fill="#45616f"/><g>${Array.from({length:5},(_,i)=>`<rect x="${280+i*95}" y="${80+i*58}" width="360" height="46" rx="14" fill="#0f202a" stroke="#25404f"/><circle cx="${305+i*95}" cy="${103+i*58}" r="8" fill="#80e9ff" opacity="${1-i*.12}"/>`).join('')}</g></svg>`;
 if(type==='event')return `<svg ${common}><defs><linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#efd8c8"/><stop offset="1" stop-color="#a96e5e"/></linearGradient></defs><rect width="800" height="520" fill="url(#e)"/><path d="M275 430 V235 A125 125 0 0 1 525 235 V430" fill="none" stroke="#fff4e9" stroke-width="16"/><circle cx="370" cy="310" r="38" fill="#b47760"/><rect x="338" y="350" width="64" height="120" rx="25" fill="#342824"/><circle cx="445" cy="310" r="38" fill="#b47760"/><rect x="413" y="350" width="64" height="120" rx="25" fill="#f5eee8"/><g fill="#4d3b35">${[100,150,650,700].map((x,i)=>`<rect x="${x}" y="${360+(i%2)*20}" width="24" height="100" rx="12"/>`).join('')}</g></svg>`;
 if(type==='negative')return `<svg ${common}><rect width="800" height="520" fill="#d7d2c8"/><rect x="75" y="55" width="650" height="410" fill="#c7c2b7"/><circle cx="200" cy="245" r="58" fill="#ad725e"/><rect x="155" y="300" width="90" height="130" rx="30" fill="#242b26"/><path d="M305 55 V465" stroke="#eeeae2" stroke-width="2" opacity=".7"/><circle cx="570" cy="250" r="100" fill="#b2ada3" opacity=".35"/></svg>`;
 return `<svg ${common}><rect width="800" height="520" fill="#111a15"/><circle cx="400" cy="260" r="120" fill="#92ffb5" opacity=".14"/></svg>`;
}
function hero(title,kicker,lede,actions=''){return `<div class="kicker">${kicker}</div><h1 class="display">${title}</h1><p class="lede">${lede}</p>${actions?`<div class="actions">${actions}</div>`:''}`}
function renderSolutions(){const tiles=[['film','Film and Video','Story to executable cinema','big','film'],['photo','Photography','Direct every image in the sequence','med','photo'],['commercial','Commercial and Product','Protect product truth and desire','med','commercial'],['music','Music Video','Start with the song','wide','music'],['documentary','Documentary and Interviews','Plan without inventing reality','sm','doc'],['social','YouTube and Social','Build repeatable formats without repetitive work','sm','social'],['series','Series and Recurring','Plan ahead at different depths','sm','series'],['events','Weddings and Events','Protect moments that cannot happen twice','sm','event']];return `<div class="page solutionsPage"><section class="shell solutionsHero">${hero('One Director. Different ways of making.','SOLUTIONS','TONDE changes the production logic around what you are creating without forcing every creator into the same workflow.',`<button class="primary" onclick="area4('signup')">Start creating</button><button class="secondary" onclick="go('discover')">Explore Discover</button>`)}<div class="solutionMosaic">${tiles.map(t=>`<button class="solTile ${t[3]}" onclick="go('${t[0]}')"><div class="art">${svgScene(t[4])}</div><div class="copy"><small>${t[0]==='photo'?'STILL IMAGE':t[0]==='series'?'RECURRING':'PRODUCTION TYPE'}</small><h3>${t[1]}</h3><p>${t[2]}</p></div></button>`).join('')}</div><div class="solPrompt"><div><div class="kicker">ONE MASTER PRODUCTION</div><h2 style="font-size:42px;margin:10px 0 8px">The interface changes. The creative truth does not.</h2><p style="color:#aebdb4;max-width:850px;line-height:1.65">Film can expose Scenes and Shots. Photography can stay Production to Shot. Music Video can anchor direction to the song. Documentary can reorganize around what reality reveals. The Director adapts without creating a different product for every format.</p></div><button class="primary" onclick="area1('how')">See how TONDE works</button></div></section></div>`}
function renderFilm(){return `<div class="page filmPage"><section class="shell filmHero">${hero('Turn story into executable cinema.','FILM AND VIDEO','Move from story intent to Scenes, Shots, performance, camera, music, sound, coverage, continuity, and execution without losing the reason each choice exists.',`<button class="primary" onclick="directThis('Direct a narrative film with TONDE')">Direct a film</button><button class="secondary" onclick="area1('studio')">See Studio</button>`)}<div class="filmStage"><div class="filmStrip"><div class="filmFrame">${svgScene('film')}<div class="frameCopy"><small>SCENE 03</small><b>The corridor should feel longer than it is.</b></div></div><div class="filmFrame">${svgScene('negative')}<div class="frameCopy"><small>SHOT 08</small><b>Hold the empty frame before the entrance.</b></div></div><div class="filmFrame">${svgScene('music')}<div class="frameCopy"><small>AUDIO</small><b>Music drops before the final line.</b></div></div></div></div></section><div class="divider"></div><section class="shell section"><div class="sectionHead"><h2>Story becomes production structure.</h2><p>A Scene is not a bucket for clips. It carries purpose, starting state, ending state, people, environment, dialogue, music, sound, continuity, and the Shots that execute the change.</p></div><div class="filmStory"><div class="storyRail"><button class="on">Scene purpose</button><button>Performance</button><button>Coverage</button><button>Camera</button><button>Lighting</button><button>Music and sound</button><button>Continuity</button></div><div class="storyCanvas"><article class="shotCard"><div class="num">SHOT 07 · WIDE</div><h3>Make the distance feel unsafe.</h3><p style="color:#9dabA1;line-height:1.6">24 mm equivalent. Camera at chest height. Subject enters from the far third. No movement until the second line.</p></article><article class="shotCard"><div class="num">SHOT 08 · CLOSE</div><h3>Hold the reaction, not the dialogue.</h3><p style="color:#9dabA1;line-height:1.6">85 mm equivalent. Eye line slightly off lens. Let the pause complete before cutting away.</p></article><article class="shotCard"><div class="num">PERFORMANCE</div><h3>The body changes before the voice.</h3><p style="color:#9dabA1;line-height:1.6">Shoulders tighten on the sound cue. Do not look toward the doorway until the second beat.</p></article><article class="shotCard"><div class="num">AUDIO</div><h3>Let silence do the work.</h3><div class="soundLine"><span>00:00 to 00:07</span><b>Room tone only</b></div><div class="soundLine"><span>00:08</span><b>Low texture enters</b></div><div class="soundLine"><span>Final line</span><b>Music stops completely</b></div></article></div></div></section></div>`}
function renderPhoto(){return `<div class="page photoPage"><section class="shell photoHero">${hero('Direct the image before you press the shutter.','PHOTOGRAPHY','Photography in TONDE is not video with the timeline removed. It is a sequence of intentional images with purpose, composition, pose, light, lens, location, and continuity.',`<button class="primary" onclick="directThis('Plan a photography sequence with TONDE')">Plan a photo series</button><button class="secondary" onclick="go('discover')">Explore techniques</button>`)}<div class="contactSheet"><figure class="photoCell a">${svgScene('photo')}<figcaption>01 · Establish relationship</figcaption></figure><figure class="photoCell b">${svgScene('negative')}<figcaption>02 · Tension</figcaption></figure><figure class="photoCell c">${svgScene('photo')}<figcaption>03 · Portrait</figcaption></figure><figure class="photoCell d">${svgScene('commercial')}<figcaption>04 · Detail</figcaption></figure><figure class="photoCell e">${svgScene('negative')}<figcaption>05 · Distance</figcaption></figure><figure class="photoCell f">${svgScene('photo')}<figcaption>06 · Closing image</figcaption></figure></div></section><section class="shell section"><div class="photoDirection"><div class="photoCopy"><div class="kicker">SEQUENCE INTENT</div><h3>Every image has a job.</h3><p>The first frame establishes the environment. The portrait makes the relationship personal. The detail carries texture. The wide frame restores distance. The closing image should feel like an answer, not merely the last photo taken.</p></div><div class="photoCopy"><div class="kicker">SHOT DIRECTION</div><h3>Direct the frame.</h3><p>Composition, subject position, expression, pose, background, lighting direction, focal behavior, depth of field, camera height, and next image purpose belong together.</p></div></div><div class="sequenceRow" style="margin-top:40px">${['Context','Portrait','Detail','Relationship','Closing'].map((x,i)=>`<div class="seqFrame"><div class="mini">${svgScene(i%2?'photo':'negative')}</div><b>${String(i+1).padStart(2,'0')} ${x}</b><span>${['Show where we are','Make eye contact feel earned','Texture carries memory','Bring both subjects into one geometry','Leave one unresolved space'][i]}</span></div>`).join('')}</div></section></div>`}
function renderCommercial(){return `<div class="page commercialPage"><section class="shell commercialHero"><div>${hero('Make the product impossible to misunderstand.','COMMERCIAL AND PRODUCT','Protect product truth, audience message, visual desire, hero angles, lighting, sound, and execution inside one directed commercial.',`<button class="primary" onclick="directThis('Direct a product commercial with TONDE')">Direct a commercial</button><button class="secondary" onclick="area2('hybrid')">See Hybrid</button>`)}</div><div class="productStage"><div class="productBottle"><div class="productLabel">NORTH<br>01</div></div><div class="lightMarker lm1">KEY · large soft source<br>45° camera left</div><div class="lightMarker lm2">EDGE · narrow strip<br>protect bottle contour</div><div class="lightMarker lm3">HERO STOP<br>label fully readable</div></div></section><section class="shell section"><div class="sectionHead"><h2>Product truth becomes a production rule.</h2><p>TONDE can keep proportions, label position, color, finish, handling, hero angles, and state consistent across Real Production, AI Creation, and Hybrid execution.</p></div><div class="productLock"><article class="productRule"><small>PRODUCT LOCK</small><h3>What cannot drift</h3><p>Shape, label placement, cap, color, material, logo, and readable brand surfaces.</p></article><article class="productRule"><small>MESSAGE</small><h3>What the viewer should feel</h3><p>Quiet precision. Premium without feeling fragile. Tactile rather than futuristic.</p></article><article class="productRule"><small>SHOT 03</small><h3>Reveal the finish</h3><p>Slow orbit. Keep reflections controlled. Stop with the label square to camera.</p></article><article class="productRule"><small>SOUND</small><h3>Make texture audible</h3><p>One restrained surface sound on movement. No large impact. Let the visual stay premium.</p></article></div></section></div>`}
function renderMusic(){const bars=Array.from({length:54},(_,i)=>`<i style="height:${25+((i*17)%70)}%"></i>`).join('');return `<div class="page musicPage"><section class="shell musicHero">${hero('Start with the song.','MUSIC VIDEO','The track becomes a production spine. TONDE maps sections, energy, lyrics, performance, camera, lighting, transitions, and story to the music instead of treating it as background.',`<button class="primary" onclick="directThis('Direct a music video from my song')">Direct my song</button><button class="secondary" onclick="area1('studio')">See Studio</button>`)}<div class="trackBoard"><div class="wave">${bars}</div><div class="trackLabels"><button>INTRO</button><button class="on">VERSE 01</button><button>CHORUS</button><button>VERSE 02</button><button>OUTRO</button></div></div></section><section class="shell section"><div class="musicGrid"><div class="performanceVisual"><div class="stageRay ray1"></div><div class="stageRay ray2"></div><div class="stageRay ray3"></div><div class="performer"></div><div class="caption">CHORUS · camera energy increases with the vocal lift</div></div><div class="beatStack"><article class="beatCard"><div class="metric">VERSE 01</div><b>Keep the camera restrained.</b><p>Locked framing and slower performance give the chorus somewhere to expand.</p><div class="energyMeter"><i style="width:34%"></i></div></article><article class="beatCard"><div class="metric">CHORUS</div><b>Release movement.</b><p>Move closer. Increase lateral motion. Raise contrast and visual density without abandoning the character lock.</p><div class="energyMeter"><i style="width:82%"></i></div></article><article class="beatCard"><div class="metric">FINAL LINE</div><b>Let the image outlive the song.</b><p>Hold the final frame after the track falls away. No added cue. Let room tone return.</p><div class="energyMeter"><i style="width:18%"></i></div></article></div></div></section></div>`}
function renderDocumentary(){return `<div class="page docPage"><section class="shell docHero">${hero('Direct the production without inventing reality.','DOCUMENTARY AND INTERVIEWS','Prepare the questions, subjects, locations, B roll, archive, room tone, and visual approach. Then let the actual material change the structure when reality gives you something different.',`<button class="primary" onclick="directThis('Plan a documentary interview production')">Plan a documentary</button><button class="secondary" onclick="go('technique')">See interview technique</button>`)}<div class="docBoard"><div class="interviewPortrait">${svgScene('doc')}<div class="caption">SUBJECT 02 · window side interview · retain environmental context</div></div><aside class="fieldNotes"><div class="kicker">FIELD NOTES</div><h3>Questions with a reason.</h3><div class="question"><small>OPEN</small><b>What changed first, before anyone else noticed?</b></div><div class="question"><small>FOLLOW</small><b>Who disagreed with you, and why?</b></div><div class="question"><small>DETAIL</small><b>Show me the place where that decision happened.</b></div><div class="question"><small>PROTECT TRUTH</small><b>Do not suggest an answer the subject has not given.</b></div></aside></div></section><section class="shell section"><div class="sectionHead"><h2>Plan what can be planned. Adapt to what is discovered.</h2><p>Documentary direction should make the crew more prepared without forcing reality into a prewritten story. TONDE can reorganize interviews, B roll, archive, establishing material, and sound around what is actually captured.</p></div><div class="brollGrid">${[['Environment','doc'],['Hands at work','commercial'],['Transit','film'],['Room tone','negative']].map(([t,v])=>`<div class="broll">${svgScene(v)}<div class="caption">${t}</div></div>`).join('')}</div></section></div>`}
function renderSocial(){return `<div class="page socialPage"><section class="shell socialHero">${hero('Build a repeatable format without making repetitive work.','YOUTUBE AND SOCIAL','Hook, promise, proof, visual change, performance, sound, platform constraints, and delivery can become a repeatable production language while every episode keeps its own purpose.',`<button class="primary" onclick="directThis('Plan a recurring YouTube and social format')">Plan a content format</button><button class="secondary" onclick="go('series')">See Series</button>`)}<div class="deviceWall"><div class="phone"><div class="screen">${svgScene('social')}<div class="formatTag">9:16 SHORT</div></div></div><div class="landscape"><div class="screen">${svgScene('film')}<div class="formatTag">16:9 EPISODE</div></div></div><div class="phone"><div class="screen">${svgScene('commercial')}<div class="formatTag">9:16 ADAPTATION</div></div></div></div></section><section class="shell section"><div class="sectionHead"><h2>The format stays recognizable. The idea still changes.</h2><p>Recurring content works when the audience recognizes the promise, pacing, host behavior, visual language, and payoff without feeling like every episode was stamped from the same template.</p></div><div class="contentArc">${[['Hook','Make the promise visible quickly'],['Context','Give the viewer enough to care'],['Proof','Show evidence or process'],['Change','Introduce a new visual or idea'],['CTA','End with one clear next action']].map(([a,b],i)=>`<div class="arcStep"><small>0${i+1}</small><b>${a}</b><p>${b}</p></div>`).join('')}</div></section></div>`}
function renderSeries(){const eps=[['01','Money in small towns','Ready','Done','Done','Ready'],['02','How one bakery grew','Ready','Done','Current',''],['03','The mechanic who automated','Story','Done','',''],['04','Why this town went cashless','Idea','','',''],['05','A family store after 40 years','Idea','','','']];return `<div class="page seriesPage"><section class="shell seriesHero">${hero('Plan ahead without generating the whole future.','SERIES AND RECURRING CONTENT','Keep the Series Bible stable while Episodes move through idea, story, script, production readiness, execution, and approval at different depths.',`<button class="primary" onclick="directThis('Build a recurring series with Generate Ahead')">Build a series</button><button class="secondary" onclick="area1('memory')">See Production Memory</button>`)}<div class="seriesDesk"><aside class="bible"><div class="kicker" style="color:#80e9ff">SERIES BIBLE</div><h3>Small Town Money</h3><div class="bibleItem"><small>HOST</small><b>Curious, practical, never condescending</b></div><div class="bibleItem"><small>FORMAT</small><b>8 to 12 minute field episode</b></div><div class="bibleItem"><small>VISUAL RULE</small><b>Natural locations, real businesses, visible process</b></div><div class="bibleItem"><small>QUESTION</small><b>How does this actually work here?</b></div></aside><div class="episodes">${eps.map(e=>`<div class="episode"><div class="epNum">EP ${e[0]}</div><div class="epTitle">${e[1]}</div><div class="stageChip ${e[2]==='Ready'?'done':''}">${e[2]||'Idea'}</div><div class="stageChip ${e[3]==='Done'?'done':''}">${e[3]||'Story'}</div><div class="stageChip ${e[4]==='Current'?'current':e[4]==='Done'?'done':''}">${e[4]||'Script'}</div><div class="stageChip ${e[5]==='Ready'?'done':''}">${e[5]||'Production'}</div></div>`).join('')}</div></div></section><section class="shell section"><div class="sectionHead"><h2>Generate Ahead controls depth, not just volume.</h2><p>You may want 365 ideas, 30 developed stories, 14 scripts, seven complete Productions, and only today's Episode fully approved. TONDE should not eagerly generate every detail of every future Episode.</p></div><div class="generateAhead"><div class="depthBlock"><div class="kicker" style="color:#80e9ff">PLANNING DEPTH</div>${[['Ideas',100,365],['Stories',62,30],['Scripts',38,14],['Production ready',20,7]].map(([n,w,c])=>`<div class="depthRow"><b>${n}</b><div class="depthLine"><i style="width:${w}%"></i></div><span>${c}</span></div>`).join('')}</div><div class="picture" style="min-height:360px">${svgScene('series')}<div class="caption">PRODUCTION LINE · see what is ready, blocked, or waiting for a decision</div></div></div></section></div>`}
function renderEvents(){return `<div class="page eventsPage"><section class="shell eventsHero">${hero('Plan the moments you cannot ask to happen twice.','WEDDINGS AND EVENTS','Build coverage around the event timeline, people, priorities, camera positions, sound, venue, and emotional moments while staying ready for reality to move.',`<button class="primary" onclick="directThis('Plan wedding and event coverage with TONDE')">Plan event coverage</button><button class="secondary" onclick="area2('real')">See Real Production</button>`)}<div class="ceremonyStage"><div class="arch"></div><div class="couple one"></div><div class="couple two"></div><div class="guest g1"></div><div class="guest g2"></div><div class="guest g3"></div><div class="guest g4"></div><div class="caption">CEREMONY · protect vows, reactions, family sight lines, and clean audio</div></div></section><section class="shell section"><div class="sectionHead"><h2>The timeline is real. The event is not predictable.</h2><p>TONDE can plan entrances, vows, speeches, first dance, family reactions, portraits, audio feeds, venue restrictions, weather alternatives, and camera responsibilities without pretending the day will follow every minute exactly.</p></div><div class="eventTimeline">${[['2:30','Details','Dress, rings, room, hands'],['3:15','Portraits','Immediate family first'],['4:00','Ceremony','Protect entrance and vows'],['4:40','Reactions','Parents and closest friends'],['5:10','Couple','Short portrait sequence'],['6:30','Speeches','Two camera plus clean feed'],['7:15','Dance','Wide, reaction, detail']].map(([t,n,d])=>`<div class="moment"><time>${t}</time><b>${n}</b><p>${d}</p></div>`).join('')}</div></section></div>`}
function renderDiscover(){const cards=[['negative','Composition','Negative space for tension','big','negative'],['orbit','Camera','Product orbit reveal','med','commercial'],['handheld','Camera','Handheld tension','med','film'],['silhouette','Lighting','Silhouette reveal','wide','music'],['overhead','Photography','Overhead food composition','sm','commercial'],['match','Movement','Motion match transition','sm','film'],['negative','Documentary','Interview with environmental depth','sm','doc'],['orbit','Commercial','Control reflections on glossy products','sm','commercial'],['handheld','Story','Hold the reaction after the line','med','photo'],['silhouette','Music Video','Use the chorus to change visual density','med','music']];return `<div class="page discoverPage"><section class="shell discoverHero">${hero('Find the idea behind the image.','DISCOVER','Production knowledge, techniques, references, and examples become useful when TONDE can explain why they work and carry the principle into something you actually want to make.',`<button class="primary" onclick="directThis('Start from a Discover technique')">Direct something</button><button class="secondary" onclick="go('solutions')">Browse solutions</button>`)}<div class="discoverTools"><div class="chiprow"><button class="chip active">All</button><button class="chip">Camera</button><button class="chip">Story</button><button class="chip">Light</button><button class="chip">Sound</button><button class="chip">Photography</button></div><input aria-label="Search Discover" placeholder="Search techniques and production knowledge"></div><div class="magGrid">${cards.map(c=>`<button class="magCard ${c[3]}" onclick="selectedTechnique('${c[0]}')">${svgScene(c[4])}<div class="mc"><small>${c[1]}</small><b>${c[2]}</b></div></button>`).join('')}</div></section></div>`}
function renderTechnique(){const t=TECHNIQUES[currentTech]||TECHNIQUES.negative;return `<div class="page techPage"><section class="shell techHero">${hero(t.title.toLowerCase()+'.','TECHNIQUE · '+t.category,t.purpose+`. TONDE treats a technique as production knowledge that changes camera, blocking, light, prompt, transition, edit, or sound direction when it is useful.`,`<button class="primary" onclick="directThis('${t.title}')">Direct this</button><button class="secondary" onclick="go('discover')">Back to Discover</button>`)}<div class="techVisual">${svgScene(currentTech==='negative'?'negative':currentTech==='orbit'?'commercial':currentTech==='handheld'?'film':currentTech==='silhouette'?'music':currentTech==='overhead'?'commercial':'film')}<div class="caption">${t.title.toUpperCase()} · principle before imitation</div></div><div class="techStats"><div class="techStat"><small>CAMERA</small><b>${t.camera}</b></div><div class="techStat"><small>LIGHT</small><b>${t.light}</b></div><div class="techStat"><small>SOUND</small><b>${t.sound}</b></div><div class="techStat"><small>USE WHEN</small><b>${t.purpose}</b></div></div></section><section class="shell section"><div class="techBody"><nav class="techNav">${Object.entries(TECHNIQUES).map(([id,x])=>`<button class="${id===currentTech?'on':''}" onclick="currentTech='${id}';render()">${x.title}</button>`).join('')}</nav><article class="techArticle"><div class="kicker">WHY IT WORKS</div><h2>Use the principle, not the original scene.</h2><p>${t.purpose}. The production value comes from understanding the relationship between composition, movement, performance, light, sound, and timing. TONDE should adapt that relationship to the creator's actual Production rather than reproduce a source image or scene.</p><div class="realAi"><div class="modeBox"><small>REAL PRODUCTION</small><h3>Execute it physically.</h3><p>${t.real}</p></div><div class="modeBox"><small>AI CREATION</small><h3>Translate it into generation direction.</h3><p>${t.ai}</p></div></div><div style="margin-top:42px"><div class="kicker">MAKE IT YOURS</div><h2 style="margin-top:12px">Change the context. Keep the reason.</h2><p>Use a different subject, location, story, product, cast, Production Kit, or world. The technique remains useful because the creator understands what problem it solves and which production variables make it work.</p></div></article></div></section></div>`}
function render(){nav();document.getElementById('mobileMenu').classList.remove('open');const r=(location.hash||'#solutions').slice(1);const fn={solutions:renderSolutions,film:renderFilm,photo:renderPhoto,commercial:renderCommercial,music:renderMusic,documentary:renderDocumentary,social:renderSocial,series:renderSeries,events:renderEvents,discover:renderDiscover,technique:renderTechnique}[r]||renderSolutions;document.getElementById('app').innerHTML=fn();window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('hashchange',render);render();
</script>
<script id="tonde-embed-bridge">(function(){
const routes={"brand:home": "/", "brand:product": "/product/", "brand:how": "/how-it-works/", "brand:studio": "/studio/", "brand:memory": "/production-memory/", "brand:about": "/about/", "creation:real": "/create/real-production/", "creation:ai": "/create/ai-creation/", "creation:hybrid": "/create/hybrid-production/", "creation:shotmatch": "/shot-match/", "solutions:solutions": "/solutions/", "solutions:film": "/solutions/film-video/", "solutions:photo": "/solutions/photography/", "solutions:commercial": "/solutions/commercial-product/", "solutions:music": "/solutions/music-video/", "solutions:documentary": "/solutions/documentary-interviews/", "solutions:social": "/solutions/youtube-social/", "solutions:series": "/solutions/series-recurring/", "solutions:events": "/solutions/weddings/", "solutions:discover": "/discover/", "solutions:technique": "/discover/techniques/", "resources:guides": "/resources/guides/", "resources:examples": "/resources/examples/", "resources:case": "/resources/case-study/", "resources:help": "/resources/help/", "resources:updates": "/resources/updates/", "resources:pricing": "/pricing/", "resources:security": "/security/", "resources:privacy": "/privacy/", "resources:terms": "/terms/", "resources:rights": "/content-rights/", "resources:login": "/login/", "resources:signup": "/signup/", "resources:forgot": "/forgot-password/"};
function send(path){window.parent.postMessage({tonde:'navigate',path:path},'*')}
function childRoute(area,id){return routes[area+':'+id]||routes[area+':home']||'/'}
function jump(area,id){send(childRoute(area,id))}
window.area1=(id)=>jump('brand',id);window.area2=(id)=>jump('creation',id);window.area3=(id)=>jump('solutions',id);window.area4=(id)=>jump('resources',id);
window.external=(file,id)=>jump(file.includes('brand')?'brand':file.includes('creation')?'creation':file.includes('solutions')?'solutions':'resources',id);
window.directThis=(title)=>{try{sessionStorage.setItem('tondeMarketingIntent',title)}catch(e){};jump('brand','home')};
const previousGo=window.go;
window.go=(id)=>{let current="solutions";let to=childRoute(current,id);if(to){send(to)}else if(previousGo){previousGo(id)}};
window.openFuture=(title)=>{jump(/Creation/i.test(title)?'creation':/Solutions|Discover/i.test(title)?'solutions':'resources',/Resources/i.test(title)?'guides':/Discover/i.test(title)?'discover':/Creation/i.test(title)?'real':'solutions')};
window.planned=(label)=>{ if(/Solutions/i.test(label))return jump('solutions','solutions'); if(/Discover|Techniques/i.test(label))return jump('solutions','discover'); if(/Pricing/i.test(label))return jump('resources','pricing'); if(/Account|Sign in/i.test(label))return jump('resources','login');if(/Guides/i.test(label))return jump('resources','guides'); if(/Examples/i.test(label))return jump('resources','examples');if(/Security/i.test(label))return jump('resources','security'); if(/Start|creating/i.test(label))return jump('resources','signup'); window.parent.postMessage({tonde:'notice',message:'This action is not connected to a live service.'},'*')};
function updateSize(){let h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,document.getElementById('app')?.scrollHeight||0);window.parent.postMessage({tonde:'height',height:h},'*')}
new ResizeObserver(updateSize).observe(document.body);window.addEventListener('load',updateSize);setTimeout(updateSize,100);setTimeout(updateSize,650);
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id){window.parent.postMessage({tonde:'route',path:childRoute("solutions",id)},'*')}setTimeout(updateSize,10)});
})();</script></body></html>
