[project]
name = "tonde-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "starlette==1.3.1",
  "uvicorn==0.34.3",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
  "imageio-ffmpeg==0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 180

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
mypy_path = "typings"
python_version = "3.12"
files = ["app", "server.py", "vercel_app.py"]
check_untyped_defs = true
warn_unused_ignores = true
